name: CI

# The merge gate (D08, D10). static, test and e2e are the required status
# checks on main; rename one only together with the branch protection rule.
# Nothing here deploys and no job holds a Cloudflare credential: Cloudflare
# Workers Builds deploys main and builds a Preview of every other branch.
#
# Every action is pinned to a full commit sha, with its version in a comment;
# Dependabot (.github/dependabot.yml) proposes the bumps. zizmor audits this
# directory on every run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm format:check
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}

  test:
    # Vitest: unit tests in Node, and the Durable Object inside workerd.
    # Separate from static so a formatting nit never masks a real failure.
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    # Playwright against the local dev server: the real Worker and Durable
    # Object in workerd, real WebSockets, two pages typing into one note.
    #
    # Runs in the official Playwright image, which already carries Chromium and
    # its system libraries, so the job skips the slow apt install. The tag must
    # match the exact @playwright/test version in package.json, and the digest
    # pins that tag's image; bump all three together. --user 1001 matches the
    # runner's uid, as the Playwright docs recommend, so the mounted workspace
    # and caches stay writable.
    name: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  zizmor:
    # Static analysis of the workflows and dependabot.yml (template injection,
    # unpinned actions, excessive permissions, credential persistence). Findings
    # fail the job and print in its log; nothing is uploaded, so the job needs
    # no security-events permission.
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          persona: pedantic
          # zizmor itself, pinned like the actions; bump it with the action.
          version: 1.31.1
