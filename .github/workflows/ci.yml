name: CI

# The merge gate (D08, D10). static, test and e2e are the required status
# checks on main; rename one only together with the branch protection rule.
# e2e waits for its three shards (e2e-shard).
# Nothing here deploys and no job holds a Cloudflare credential: Cloudflare
# Workers Builds deploys main and builds a Preview of every other branch.
#
# Every action is pinned to a full commit sha, with its version in a comment;
# Dependabot (.github/dependabot.yml) proposes the bumps. zizmor audits this
# directory on every run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm format:check
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}

  test:
    # Vitest: unit tests in Node, and the Durable Object inside workerd.
    # Separate from static so a formatting nit never masks a real failure.
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e-shard:
    # Playwright against the local dev server: the real Worker and Durable
    # Object in workerd, real WebSockets, two pages typing into one note, and
    # the visual suite's screenshots (D27). Split in three shards that run at
    # once; the e2e job below is the one required check.
    #
    # Runs in the official Playwright image, which already carries Chromium and
    # its system libraries, so the job skips the slow apt install, and the
    # screenshots match the baselines taken in it (scripts/e2e-docker.sh). The
    # tag must match the exact @playwright/test version in package.json, and
    # the digest pins that tag's image; bump all three together. --user 1001
    # matches the runner's uid, as the Playwright docs recommend, so the
    # mounted workspace and caches stay writable.
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e --shard="${SHARD}/3"
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e:
    # The required check: passes only when every shard passed.
    name: e2e
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: test "$SHARDS" = success
        env:
          SHARDS: ${{ needs.e2e-shard.result }}

  zizmor:
    # Static analysis of the workflows and dependabot.yml (template injection,
    # unpinned actions, excessive permissions, credential persistence). Findings
    # fail the job and print in its log; nothing is uploaded, so the job needs
    # no security-events permission.
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          persona: pedantic
          # zizmor itself, pinned like the actions; bump it with the action.
          version: 1.31.1
