# Deploy-on-green (D10): production is "the latest green tip of main", not
# "every green commit". When CI finishes successfully on main, this job
# deploys that commit to Cloudflare, but only if it is still the tip of
# main. Intermediate commits of a fast merge train, and stale re-runs of old
# green CI, are deliberately skipped: deploying them would put OLDER code in
# production after newer code.
#
# There are no PR preview deployments: Cloudflare does not generate Workers
# preview URLs for Workers that use Durable Objects (D10).
name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy green main commit
    # head_repository must be THIS repo: a fork PR from a branch literally
    # named 'main' also satisfies head_branch == 'main', and workflow_run
    # runs with the repository's secrets: without this check a fork could
    # get its code deployed (pwn request).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check the commit is still the tip of main
        id: tip
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Deploys happen only for the CURRENT tip of main. A re-run of an
          # old green CI run, or an intermediate commit of a fast merge
          # train, would otherwise deploy OLD code over newer code. Skipping
          # here is deliberate policy: production is "latest green main",
          # not "every green commit".
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            echo "sha $SHA is not the current tip of origin/main: skipping (stale re-run or superseded commit)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.tip.outputs.deploy == 'true'
      - uses: actions/setup-node@v5
        if: steps.tip.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.tip.outputs.deploy == 'true'
      # The Vite plugin builds the client and the Worker together; wrangler
      # deploy then reads the built output.
      - run: pnpm build
        if: steps.tip.outputs.deploy == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: steps.tip.outputs.deploy == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
