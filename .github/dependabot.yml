# Dependabot proposes GitHub Actions bumps only; CI gates them like any other
# pull request (D08). npm updates are made by hand: a Dependabot branch is a
# same-repo branch, which Workers Builds builds with its production-capable
# token before anyone reviews it (D10). A cooldown leaves each action release a
# week to be yanked or flagged before it is proposed.
version: 2
updates:
  # The sha-pinned actions in .github/workflows (D10).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: Bump
