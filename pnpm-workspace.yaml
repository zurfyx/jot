  '@lexical/code-core': https://pkg.pr.new/facebook/lexical/@lexical/code-core@1eff767641553b12126c484696555be4ce094dae
  '@lexical/devtools-core': https://pkg.pr.new/facebook/lexical/@lexical/devtools-core@1eff767641553b12126c484696555be4ce094dae
  '@lexical/dragon': https://pkg.pr.new/facebook/lexical/@lexical/dragon@1eff767641553b12126c484696555be4ce094dae
  '@lexical/extension': https://pkg.pr.new/facebook/lexical/@lexical/extension@1eff767641553b12126c484696555be4ce094dae
