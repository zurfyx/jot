  '@lexical/code-prism': https://pkg.pr.new/meta/lexical/@lexical/code-prism@85d811d464b7eec5d8302668f7a48a1d059671cf
  '@lexical/devtools-core': https://pkg.pr.new/meta/lexical/@lexical/devtools-core@85d811d464b7eec5d8302668f7a48a1d059671cf
