  '@lexical/code-core': https://pkg.pr.new/meta/lexical/@lexical/code-core@99eedf652015b6efd29bcd9185898eac1c300b89
  '@lexical/devtools-core': https://pkg.pr.new/meta/lexical/@lexical/devtools-core@99eedf652015b6efd29bcd9185898eac1c300b89
  '@lexical/dragon': https://pkg.pr.new/meta/lexical/@lexical/dragon@99eedf652015b6efd29bcd9185898eac1c300b89
  '@lexical/extension': https://pkg.pr.new/meta/lexical/@lexical/extension@99eedf652015b6efd29bcd9185898eac1c300b89
