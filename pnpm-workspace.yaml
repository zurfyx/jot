# pnpm settings only. This is a single package, not a workspace: there is
# no `packages:` list. pnpm 11+ reads settings here, not from package.json.

# Every lexical and @lexical/* package comes from one pkg.pr.new commit, so
# the app holds a single copy of Lexical (D04). scripts/bump-lexical.mjs
# rewrites these together with package.json.
