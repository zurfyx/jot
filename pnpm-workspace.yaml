# pkg.pr.new packages depend on each other by URL.
blockExoticSubdeps: false

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  # Astryx's postinstall only prints a hint to run `astryx init`.
  '@astryxdesign/core': false
  '@astryxdesign/cli': false
