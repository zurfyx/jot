# pnpm settings only. This is a single package, not a workspace: there is
# no `packages:` list. pnpm 11+ reads settings here, not from package.json.

# Every lexical and @lexical/* package comes from one Lexical build (an exact
# npm version, or a pkg.pr.new commit), so the app holds a single copy of
# Lexical (D04). scripts/bump-lexical.mjs rewrites these together with
# package.json.
overrides:
  '@lexical/a11y': 0.53.1-nightly.20261106.0
  '@lexical/clipboard': 0.53.1-nightly.20261106.0
  '@lexical/code': 0.53.1-nightly.20261106.0
  '@lexical/code-core': 0.53.1-nightly.20261106.0
  '@lexical/devtools-core': 0.53.1-nightly.20261106.0
  '@lexical/dragon': 0.53.1-nightly.20261106.0
  '@lexical/extension': 0.53.1-nightly.20261106.0
  '@lexical/file': 0.53.1-nightly.20261106.0
  '@lexical/hashtag': 0.53.1-nightly.20261106.0
  '@lexical/headless': 0.53.1-nightly.20261106.0
  '@lexical/history': 0.53.1-nightly.20261106.0
  '@lexical/html': 0.53.1-nightly.20261106.0
  '@lexical/internal': 0.53.1-nightly.20261106.0
  '@lexical/link': 0.53.1-nightly.20261106.0
  '@lexical/list': 0.53.1-nightly.20261106.0
