  '@lexical/code-prism': https://pkg.pr.new/meta/lexical/@lexical/code-prism@faa10275419959865d8230d0ae367699bf9ebcbc
  '@lexical/devtools-core': https://pkg.pr.new/meta/lexical/@lexical/devtools-core@faa10275419959865d8230d0ae367699bf9ebcbc
