  '@lexical/table': 0.53.1-nightly.20261106.0
  '@lexical/text': 0.53.1-nightly.20261106.0
  '@lexical/utils': 0.53.1-nightly.20261106.0
  '@lexical/y': 0.53.1-nightly.20261106.0
